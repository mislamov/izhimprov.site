<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Гости Timepad | Школа Ижевского Импрова</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="timepad-checked-at" content="2026-11-04T23:48:03+04:00">
  <link rel="canonical" href="https://izhimpro.ru/timepad/">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .report { padding: 64px 0; }
    .report h1 { font-size: clamp(32px, 5vw, 56px); margin-bottom: 12px; }
    .report-meta { color: var(--color-muted); margin-bottom: 32px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--color-line); }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 860px; }
    .event-column { width: 112px; }
    .price-column { width: 108px; }
    .amount-column { width: 100px; }
    .tickets-column { width: 92px; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--color-line); vertical-align: top; }
    th { color: var(--color-muted); font-size: 14px; font-weight: 500; }
    td.event { color: var(--color-muted); font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
    .number, .money { text-align: right; white-space: nowrap; }
    .ticket-count { color: var(--color-milk); font-size: 22px; font-weight: 700; }
    .ticket-button { min-width: 42px; padding: 2px 6px; border: 0; border-radius: 6px; background: transparent; color: inherit; cursor: pointer; font: inherit; font-weight: 700; }
    .ticket-button:hover, .ticket-button:focus-visible { background: rgba(238, 231, 213, 0.14); outline: 2px solid var(--color-orange); outline-offset: 2px; }
    tr.redeemed-all td { color: rgba(238, 231, 213, 0.34) !important; }
    tr.redeemed-all .ticket-button { color: rgba(238, 231, 213, 0.34); }
    .cash-row { background: rgba(254, 77, 0, 0.13); }
    .cash-row td.event { color: #ff9a70; }
    tr.redeemed-all.cash-row { background: rgba(254, 77, 0, 0.035); }
    .total td { font-weight: 500; border-bottom: 0; }
    .sort-button { appearance: none; border: 0; padding: 0; background: transparent; color: inherit; cursor: pointer; font: inherit; font-weight: inherit; }
    .sort-button:hover { color: var(--color-milk); }
    .redeemed-modal { width: min(360px, calc(100vw - 32px)); border: 1px solid var(--color-line); border-radius: 12px; padding: 24px; background: var(--color-dark-2); color: var(--color-milk); }
    .redeemed-modal::backdrop { background: rgba(0, 0, 0, 0.68); }
    .redeemed-modal h2 { font-size: 24px; margin: 0 0 8px; }
    .redeemed-modal p { color: var(--color-muted); margin: 0 0 20px; }
    .redeemed-stepper { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 18px 0 24px; }
    .step-button { width: 44px; height: 44px; border: 1px solid var(--color-line); border-radius: 8px; background: var(--color-dark-3); color: var(--color-milk); cursor: pointer; font-size: 24px; }
    .step-button:hover, .step-button:focus-visible { border-color: var(--color-orange); outline: none; }
    .redeemed-value { min-width: 48px; text-align: center; font-size: 30px; font-weight: 700; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .modal-actions button { min-height: 42px; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--color-line); background: transparent; color: var(--color-milk); cursor: pointer; font: inherit; }
    .modal-actions .confirm { border-color: var(--color-orange); background: var(--color-orange); color: #fff; }
    .mobile-label { display: none; }
    .mobile-total { display: none; }
    @media (max-width: 600px) {
      .report { padding: 40px 0; }
      table { min-width: 0; font-size: 14px; }
      th, td { padding: 10px 8px; }
      .event-column { display: none; width: 0; }
      th.event-header, td.event { display: none; }
      .price-column, .price-header, .price-cell, .amount-column, .amount-header, .amount-cell { display: none; }
      .tickets-column { width: 54px; }
      .ticket-count { font-size: 20px; }
      .desktop-label { display: none; }
      .mobile-label { display: inline; }
      .desktop-total { display: none; }
      .mobile-total { display: table-cell; }
    }
  </style>
</head>
<body>
  <main class="report">
    <div class="container">
      <h1>Гости Timepad</h1>
      <p class="report-meta">Подходящих событий нет.</p>
      
      <p class="report-meta">Оплаченные билеты. Timepad проверен <strong id="timepad-check-age">только что</strong>.</p>
      <div class="table-wrap">
        <table>
          <colgroup><col class="event-column"><col><col class="price-column"><col class="amount-column"><col class="tickets-column"></colgroup>
          <thead><tr><th class="event-header">Событие</th><th><button class="sort-button" type="button" aria-label="Сортировать по участнику" aria-sort="none">Участник &#8597;</button></th><th class="number price-header">Цена</th><th class="number amount-header">Сумма</th><th class="number"><span class="desktop-label">Кол-во билетов</span><span class="mobile-label">Бил.</span></th></tr></thead>
          <tbody><tr class="total"><td class="desktop-total" colspan="3">Итого</td><td class="mobile-total" colspan="1">Итого</td><td class="number money amount-cell">0 ₽</td><td class="number ticket-count">0</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
  <dialog class="redeemed-modal" id="redeemed-modal">
    <h2>Погашенные билеты</h2>
    <p id="redeemed-description"></p>
    <div class="redeemed-stepper">
      <button class="step-button" type="button" data-step="-1" aria-label="Уменьшить количество">−</button>
      <output class="redeemed-value" id="redeemed-value">0</output>
      <button class="step-button" type="button" data-step="1" aria-label="Увеличить количество">+</button>
    </div>
    <div class="modal-actions">
      <button type="button" data-cancel>Отмена</button>
      <button class="confirm" type="button" data-confirm>ОК</button>
    </div>
  </dialog>
  <script>
    (() => {
      const button = document.querySelector('.sort-button');
      const body = document.querySelector('tbody');
      const total = body.querySelector('.total');
      const modal = document.querySelector('#redeemed-modal');
      const valueOutput = document.querySelector('#redeemed-value');
      const description = document.querySelector('#redeemed-description');
      const storageKey = 'izhimpro-timepad-redeemed-tickets';
      const checkAge = document.querySelector('#timepad-check-age');
      const checkedAt = Date.parse(document.querySelector('meta[name="timepad-checked-at"]').content) || Date.now();
      const updateCheckAge = () => {
        const seconds = Math.max(0, Math.floor((Date.now() - checkedAt) / 1000));
        if (seconds < 60) checkAge.textContent = 'только что';
        else if (seconds < 3600) checkAge.textContent = `${Math.floor(seconds / 60)} мин. назад`;
        else if (seconds < 86400) checkAge.textContent = `${Math.floor(seconds / 3600)} ч. назад`;
        else checkAge.textContent = `${Math.floor(seconds / 86400)} дн. назад`;
      };
      updateCheckAge();
      setInterval(updateCheckAge, 60000);
      let stored = {};
      try { stored = JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch (error) { stored = {}; }
      let activeRow = null;
      let draftValue = 0;

      const renderRow = (row, value) => {
        const max = Number(row.dataset.maxTickets);
        row.dataset.redeemedTickets = String(value);
        row.querySelector('.ticket-button').title = `Погашено ${value} из ${max}`;
        row.classList.toggle('redeemed-all', value >= max);
      };
      body.querySelectorAll('tr[data-row-id]').forEach((row) => {
        const max = Number(row.dataset.maxTickets);
        const saved = Number(stored[row.dataset.rowId]);
        const value = Number.isFinite(saved) ? Math.max(0, Math.min(max, saved)) : 0;
        renderRow(row, value);
      });

      const sortByPaymentTime = () => {
        const rows = [...body.querySelectorAll('tr[data-participant]')];
        rows.sort((left, right) =>
          right.dataset.paidAt.localeCompare(left.dataset.paidAt) ||
          left.dataset.participant.localeCompare(right.dataset.participant, 'ru')
        );
        rows.forEach((row) => body.insertBefore(row, total));
      };
      sortByPaymentTime();

      body.addEventListener('click', (event) => {
        const ticketButton = event.target.closest('.ticket-button');
        if (!ticketButton) return;
        activeRow = ticketButton.closest('tr[data-row-id]');
        draftValue = Number(activeRow.dataset.redeemedTickets);
        const max = Number(activeRow.dataset.maxTickets);
        description.textContent = `${activeRow.dataset.participant}: всего билетов ${max}`;
        valueOutput.textContent = String(draftValue);
        modal.showModal();
      });
      modal.addEventListener('click', (event) => {
        const step = event.target.closest('[data-step]');
        if (step && activeRow) {
          const max = Number(activeRow.dataset.maxTickets);
          draftValue = Math.max(0, Math.min(max, draftValue + Number(step.dataset.step)));
          valueOutput.textContent = String(draftValue);
        }
        if (event.target.closest('[data-cancel]')) modal.close();
        if (event.target.closest('[data-confirm]') && activeRow) {
          stored[activeRow.dataset.rowId] = draftValue;
          try { localStorage.setItem(storageKey, JSON.stringify(stored)); } catch (error) {}
          renderRow(activeRow, draftValue);
          modal.close();
        }
      });

      let direction = 1;
      button.addEventListener('click', () => {
        const rows = [...body.querySelectorAll('tr[data-participant]')];
        rows.sort((left, right) => direction * left.dataset.participant.localeCompare(right.dataset.participant, 'ru'));
        rows.forEach((row) => body.insertBefore(row, total));
        button.textContent = `Участник ${direction === 1 ? '↑' : '↓'}`;
        button.setAttribute('aria-sort', direction === 1 ? 'ascending' : 'descending');
        direction *= -1;
      });
    })();
  </script>
</body>
</html>
